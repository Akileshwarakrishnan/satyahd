version: "3.8"

services:
  satyahd:
    build: .
    container_name: satyahd-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEFAULT_PROVIDER=meta
      - ALLOW_MOCK=true
      - MODEL_NAME=muse-spark-1.3
    volumes:
      # Persist the cryptographic audit ledger and generated anchors across restarts
      - ./data:/app/data
      - ./anchors:/app/anchors
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
