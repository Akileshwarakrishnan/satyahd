name: Satyahd CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite & Evaluation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Setup Environment
        run: |
          cp .env.example .env

      - name: Execute Full Pytest Suite (156 Tests)
        run: |
          python -m pytest tests/ -v

      - name: Run Benchmark Evaluation
        run: |
          python scripts/eval.py

      - name: Run Autonomous Red-Team Suite
        run: |
          python scripts/red_team.py --local
          python scripts/red_team.py --local --plugin
